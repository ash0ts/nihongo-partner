name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: "Simulator (deterministic, no model calls)"
        run: pnpm sim --no-llm --out out/sim/ci
      - name: "Eval case files are up to date"
        run: |
          pnpm export:eval-cases
          pnpm export:composer-cases
          git diff --exit-code -- evals/datasets/grading-cases.jsonl evals/datasets/traps.json evals/datasets/items.json || (echo "Run pnpm export:eval-cases and commit" && exit 1)
      - uses: astral-sh/setup-uv@v5
      - name: "Evals (dry run, deterministic checks only)"
        working-directory: evals
        run: |
          uv sync --frozen
          uv run nihongo-evals build-dataset --dry-run
          uv run nihongo-evals grading --dry-run
          uv run nihongo-evals feedback --dry-run
          uv run nihongo-evals composer --dry-run
